<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIRIS | Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Special+Elite&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  /* ═══ BODY — dark film-noir base ═══ */
  body{
    background:#0a0806;color:#d4cec4;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ═══ FILM GRAIN OVERLAY ═══ */
  body::before{
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
    pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    background-repeat:repeat;
    opacity:.45;
  }

  /* ═══ CRT SCANLINES ═══ */
  body::after{
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,.12) 2px,
      rgba(0,0,0,.12) 4px
    );
  }

  /* Everything must sit above the overlays */
  #menu-screen,#ghost,#terminal,#bar,#credits-overlay{position:relative;z-index:10}
  #ghost{position:fixed;z-index:100}

  /* ═══ GHOST ORB — warm amber flicker ═══ */
  #ghost{
    top:14%;right:9%;width:80px;height:80px;
    border-radius:50%;display:flex;justify-content:center;align-items:center;
    cursor:default;
    background:radial-gradient(circle,#e8a832 0%,#b8741a 50%,#4a2d08 100%);
    box-shadow:0 0 30px rgba(232,168,50,.3),0 0 60px rgba(184,116,26,.1);
    animation:bulbFlicker 4s ease-in-out infinite;
    transition:top .5s cubic-bezier(.175,.885,.32,1.275);
    display:none;
  }
  .eye{width:6px;height:6px;background:#fff3d4;border-radius:50%;margin:4px;box-shadow:0 0 8px #fff3d4;opacity:.7}

  @keyframes bulbFlicker{
    0%,100%{opacity:.75;transform:scale(1)}
    10%{opacity:.65;transform:scale(.98)}
    20%{opacity:.8;transform:scale(1.01)}
    50%{opacity:.7;transform:scale(.99)}
    70%{opacity:.85;transform:scale(1.02)}
    90%{opacity:.6;transform:scale(.97)}
  }

  #ghost.thinking{
    box-shadow:0 0 40px rgba(232,168,50,.45),0 0 90px rgba(184,116,26,.2);
    animation:bulbFlicker 4s ease-in-out infinite,bulbPulse 1.2s ease-in-out infinite;
  }
  @keyframes bulbPulse{
    0%,100%{opacity:.7;transform:scale(1)}
    50%{opacity:.95;transform:scale(1.08)}
  }

  #ghost.combat{
    background:radial-gradient(circle,#ff4422 0%,#aa1100 50%,#440000 100%)!important;
    box-shadow:0 0 40px rgba(255,68,34,.5)!important;
    animation:bulbFlicker 4s ease-in-out infinite,combatFlash .15s ease-in-out 4!important;
  }
  @keyframes combatFlash{
    0%{transform:translate(0) scale(1)}25%{transform:translate(5px,-4px) scale(1.06)}
    50%{transform:translate(-6px,3px) scale(.95)}100%{transform:translate(0) scale(1)}
  }

  #ghost.explore{
    background:radial-gradient(circle,#d4a840 0%,#8a6a20 50%,#3a2a08 100%)!important;
    box-shadow:0 0 35px rgba(212,168,64,.3),0 0 70px rgba(138,106,32,.1)!important;
    animation:bulbFlicker 5.5s ease-in-out infinite!important;
  }

  #ghost.deflect{
    background:radial-gradient(circle,#fff8e0 0%,#e8d090 50%,#8a7040 100%)!important;
    box-shadow:0 0 70px rgba(255,248,224,.5)!important;
    animation:deflectBurst .3s ease-in-out 3!important;
  }
  @keyframes deflectBurst{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(5deg)}}

  /* ═══ MAIN MENU ═══ */
  #menu-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;
    background:#0a0806;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    transition:opacity .8s ease;
  }
  #menu-screen.hidden{opacity:0;pointer-events:none}

  .menu-title{
    font-family:'Special Elite','Courier New',monospace;
    font-size:4rem;font-weight:400;letter-spacing:10px;
    color:#e8a832;
    text-shadow:0 0 30px rgba(232,168,50,.3),0 0 60px rgba(232,168,50,.1);
    margin-bottom:8px;user-select:none;
    animation:titleFlicker 5s ease-in-out infinite;
  }
  @keyframes titleFlicker{
    0%,100%{opacity:.9}15%{opacity:.7}30%{opacity:.95}
    45%{opacity:.6}60%{opacity:.85}80%{opacity:.75}
  }

  .menu-subtitle{
    color:#3d3428;font-size:.8rem;letter-spacing:6px;margin-bottom:55px;
    user-select:none;font-family:'Special Elite','Courier New',monospace;
  }

  .menu-doors{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}

  .door{
    width:175px;height:235px;
    border:1px solid #1e1a14;
    background:linear-gradient(180deg,#0e0c08 0%,#141008 100%);
    border-radius:4px;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding-bottom:26px;cursor:pointer;position:relative;overflow:hidden;
    transition:all .35s ease;
  }
  .door:hover{
    border-color:#c4922a;
    box-shadow:0 0 25px rgba(196,146,42,.12),0 0 50px rgba(196,146,42,.04);
    transform:translateY(-3px);
  }
  .door:active{transform:translateY(0)}

  .door-glow{
    position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);
    width:45px;height:45px;border-radius:50%;
    filter:blur(22px);opacity:.2;transition:opacity .35s ease;
  }
  .door:hover .door-glow{opacity:.45}

  .door-label{
    font-size:.78rem;font-weight:600;letter-spacing:3px;color:#4a4030;
    transition:color .35s ease;position:relative;z-index:1;
    font-family:'Special Elite','Courier New',monospace;
  }
  .door:hover .door-label{color:#d4cec4}

  .door-num{
    font-family:'Special Elite','Courier New',monospace;
    font-size:2.2rem;color:#1a1610;margin-bottom:12px;
    transition:color .35s ease;position:relative;z-index:1;
  }
  .door:hover .door-num{color:#2a2418}

  .door.disabled{opacity:.2;cursor:not-allowed}
  .door.disabled:hover{border-color:#1e1a14;box-shadow:none;transform:none}

  .door-new .door-glow{background:#e8a832}
  .door-continue .door-glow{background:#c4922a}
  .door-credits .door-glow{background:#8a6a20}

  /* ═══ CREDITS OVERLAY ═══ */
  #credits-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:250;
    background:rgba(10,8,6,.96);display:none;
    justify-content:center;align-items:center;flex-direction:column;
  }
  #credits-overlay.show{display:flex}
  .credits-text{
    color:#4a4030;font-size:.95rem;line-height:2.2;text-align:center;letter-spacing:2px;
    font-family:'Special Elite','Courier New',monospace;
  }
  .credits-text span{color:#e8a832}
  .credits-close{
    margin-top:40px;color:#3d3428;font-size:.72rem;letter-spacing:4px;cursor:pointer;
    transition:color .3s;font-family:'Special Elite','Courier New',monospace;
  }
  .credits-close:hover{color:#d4cec4}

  /* ═══ TERMINAL ═══ */
  #terminal{
    flex:1;overflow-y:auto;padding:55px 15% 20px;
    display:flex;flex-direction:column;gap:18px;scrollbar-width:none;
    display:none;
  }
  #terminal::-webkit-scrollbar{display:none}

  .line{font-size:1.15rem;line-height:1.75;max-width:860px;animation:fadeUp .4s ease-out forwards;opacity:0;color:#b8b0a0}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .usr{color:#5a5040;font-style:italic}
  .sys{color:#3d3428;font-size:.9rem;letter-spacing:.05em}
  .err{color:#cc4433;font-size:.9rem}
  .tag{color:#e8a832;font-weight:600}
  .action{color:#c4922a;font-weight:500}
  .dmg{color:#cc4433}
  .hint{font-size:.8rem;color:#2e2820;margin-top:3px}

  /* ═══ CHOICE BUTTONS ═══ */
  .choice-row{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
  .choice-btn{
    background:transparent;border:1px solid #2a2418;color:#5a5040;
    padding:8px 22px;border-radius:3px;font-family:inherit;font-size:.88rem;
    cursor:pointer;letter-spacing:1px;transition:all .25s ease;
  }
  .choice-btn:hover{border-color:#e8a832;color:#e8a832;box-shadow:0 0 12px rgba(232,168,50,.08)}
  .choice-btn:active{background:rgba(232,168,50,.04)}

  .dots{display:inline-flex;gap:5px;align-items:center}
  .dots i{width:4px;height:4px;background:rgba(232,168,50,.4);border-radius:50%;animation:dotAnim 1.4s ease-in-out infinite;display:block}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dotAnim{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.3)}}

  .typcur{display:inline-block;width:2px;height:1.1em;background:#e8a832;margin-left:2px;vertical-align:text-bottom;animation:curBlink .7s step-end infinite}
  @keyframes curBlink{0%,100%{opacity:1}50%{opacity:0}}

  /* ═══ BOTTOM BAR ═══ */
  #bar{
    height:90px;background:rgba(10,8,6,.94);border-top:1px solid #1e1a14;
    display:flex;align-items:center;padding:0 15%;flex-shrink:0;
    display:none;
  }
  #loc{
    color:#e8a832;font-weight:800;letter-spacing:3px;margin-right:35px;font-size:.82rem;
    white-space:nowrap;user-select:none;
    font-family:'Special Elite','Courier New',monospace;
  }
  #inp{background:0;border:0;color:#d4cec4;font-size:1.15rem;flex:1;outline:0;font-family:inherit;font-weight:300;caret-color:#e8a832}
  #inp::placeholder{color:#2a2418}
  #inp:disabled{opacity:.3}

  /* ═══ RESPONSIVE ═══ */
  @media(max-width:768px){
    .menu-title{font-size:2.2rem;letter-spacing:5px}
    .menu-subtitle{font-size:.6rem;letter-spacing:3px;margin-bottom:35px}
    .door{width:135px;height:185px;padding-bottom:18px}
    .door-num{font-size:1.8rem;margin-bottom:10px}
    .door-label{font-size:.65rem;letter-spacing:2px}
    .menu-doors{gap:14px}
    #terminal{padding:30px 6% 12px}
    #bar{padding:0 6%;height:70px}
    #loc{letter-spacing:2px;font-size:.65rem;margin-right:12px}
    #inp{font-size:.95rem}
    .line{font-size:.98rem}
    #ghost{width:55px;height:55px;top:5%;right:4%}
    .eye{width:5px;height:5px;margin:3px}
  }
  @media(max-width:400px){
    .menu-title{font-size:1.7rem;letter-spacing:3px}
    .door{width:110px;height:155px}
    .door-num{font-size:1.4rem}
    #terminal{padding:22px 5% 10px}
    #bar{padding:0 5%;height:62px}
    #loc{font-size:.58rem;letter-spacing:1.5px;margin-right:8px}
    .line{font-size:.92rem}
  }
</style>
</head>
<body>

<!-- ═══ MAIN MENU ═══ -->
<div id="menu-screen">
  <div class="menu-title">OSIRIS</div>
  <div class="menu-subtitle">AMERICA, 1986</div>
  <div class="menu-doors">
    <div class="door door-new" onclick="doorNewPlayer()">
      <div class="door-glow"></div>
      <div class="door-num">I</div>
      <div class="door-label">NEW PLAYER</div>
    </div>
    <div class="door door-continue" id="door-continue" onclick="doorContinue()">
      <div class="door-glow"></div>
      <div class="door-num">II</div>
      <div class="door-label">CONTINUE</div>
    </div>
    <div class="door door-credits" onclick="doorCredits()">
      <div class="door-glow"></div>
      <div class="door-num">III</div>
      <div class="door-label">CREDITS</div>
    </div>
  </div>
</div>

<!-- ═══ CREDITS ═══ -->
<div id="credits-overlay">
  <div class="credits-text">
    <span>OSIRIS</span><br>
    America, 1986<br><br>
    Created by [Your Name]<br>
    Narrated by OSIRIS<br><br>
    <span>The silence remembers.</span>
  </div>
  <div class="credits-close" onclick="closeCredits()">[ RETURN ]</div>
</div>

<!-- ═══ GHOST ORB ═══ -->
<div id="ghost"><div class="eye"></div><div class="eye"></div></div>

<!-- ═══ TERMINAL ═══ -->
<div id="terminal"></div>

<!-- ═══ BOTTOM BAR ═══ -->
<div id="bar">
  <div id="loc">UNKNOWN</div>
  <input type="text" id="inp" placeholder="What do you do..." autofocus autocomplete="off" spellcheck="false">
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  OSIRIS — 1980s Gritty America
// ════════════════════════════════════════════════════════════════

var termEl   = document.getElementById('terminal');
var inpEl    = document.getElementById('inp');
var ghostEl  = document.getElementById('ghost');
var locEl    = document.getElementById('loc');
var menuEl   = document.getElementById('menu-screen');
var contDoor = document.getElementById('door-continue');
var creditsEl= document.getElementById('credits-overlay');

var locked = false;

// ─── GAME STATE ──────────────────────────────────────────────
var gameState = {
  character: {
    sex: '',
    age: '',
    lifeRole: '',    // nurse, plumber, mechanic, etc.
    level: 1,
    xp: 0
    // NO HP — OSIRIS has no health, no mana, no combat stats.
    // The player is a person in a gritty world, not an RPG warrior.
  },
  world: {
    location: 'UNKNOWN',
    city: '',        // NEW YORK, CLEVELAND, or CHICAGO
    chapter: 1
  },
  inventory: [],
  quests: [],
  flags: {},
  summary: '',
  recentLog: []
};

// ─── SAVE / LOAD ─────────────────────────────────────────────
var SAVE_KEY = 'osiris_save';

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
  } catch(e) { console.error('[OSIRIS] Save failed:', e); }
}

function loadGame() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    var parsed = JSON.parse(raw);
    if (parsed && parsed.character && parsed.world) {
      gameState = parsed;
      return true;
    }
    return false;
  } catch(e) { return false; }
}

function hasSave() {
  try { return localStorage.getItem(SAVE_KEY) !== null; }
  catch(e) { return false; }
}

function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

if (!hasSave()) contDoor.classList.add('disabled');

// ─── MENU ────────────────────────────────────────────────────
function hideMenu() {
  menuEl.classList.add('hidden');
  setTimeout(function() { menuEl.style.display = 'none'; }, 800);
}

function showGame() {
  ghostEl.style.display = 'flex';
  termEl.style.display = 'flex';
  document.getElementById('bar').style.display = 'flex';
}

function doorCredits() { creditsEl.classList.add('show'); }
function closeCredits() { creditsEl.classList.remove('show'); }

function doorContinue() {
  if (!hasSave()) return;
  if (!loadGame()) return;
  hideMenu();
  showGame();
  setLoc(gameState.world.location);
  setTimeout(function() { bootContinue(); }, 900);
}

function doorNewPlayer() {
  deleteSave();
  hideMenu();
  showGame();
  setTimeout(function() { beginCharacterCreation(); }, 900);
}

// ════════════════════════════════════════════════════════════════
//  API CALL — compact context payload
// ════════════════════════════════════════════════════════════════
async function callOsiris(userInput, actionLabel, extraContext) {
  // Build a clean, JSON-serializable payload (fixes DataCloneError)
  var payload = JSON.parse(JSON.stringify({
    input: String(userInput || ''),
    location: String(gameState.world.location || 'UNKNOWN'),
    city: String(gameState.world.city || ''),
    action: String(actionLabel || 'GENERAL'),
    chapter: Number(gameState.world.chapter || 1),
    character: {
      sex: String(gameState.character.sex || ''),
      age: String(gameState.character.age || ''),
      lifeRole: String(gameState.character.lifeRole || ''),
      level: Number(gameState.character.level || 1)
    },
    inventory: (gameState.inventory || []).slice(0, 10).join(', '),
    activeQuest: (gameState.quests && gameState.quests.length > 0) ? String(gameState.quests[0]) : '',
    summary: String(gameState.summary || ''),
    recentLog: (gameState.recentLog || []).slice(-4).map(function(m) {
      return { role: String(m.role), text: String(m.text) };
    }),
    extra: extraContext ? String(extraContext) : ''
  }));

  try {
    var res = await fetch('/api/osiris', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    var ct = res.headers.get('content-type') || '';
    if (ct.indexOf('application/json') === -1) {
      console.error('[OSIRIS] Non-JSON response:', res.status);
      return { ok: false, error: 'NETWORK' };
    }

    var data = await res.json();

    if (data.ok && data.text) {
      gameState.recentLog.push({ role: 'user', text: userInput });
      gameState.recentLog.push({ role: 'model', text: data.text });
      if (gameState.recentLog.length > 8) gameState.recentLog = gameState.recentLog.slice(-8);
      saveGame();
      return { ok: true, text: data.text };
    }

    return { ok: false, error: data.error || 'API_FAIL' };
  } catch (e) {
    console.error('[OSIRIS] Fetch error:', e.message);
    return { ok: false, error: 'NETWORK' };
  }
}

// ════════════════════════════════════════════════════════════════
//  INTENT DETECTION — 1980s actions
// ════════════════════════════════════════════════════════════════
function classifyAction(cmd) {
  if (/\b(attack|hit|fight|kill|strike|punch|stab|shoot|swing)\s*(osiris|the light|the glow|the watcher|you)/i.test(cmd)) return 'ATTACK_OSIRIS';
  if (/\b(attack|fight|hit|shoot|stab|punch|swing|throw|kick)\b/i.test(cmd)) return 'COMBAT';
  if (/\b(search|loot|open|grab|take|pick|steal|rummage|check|dig|pry)\b/i.test(cmd)) return 'SEARCH';
  if (/\b(look|explore|examine|inspect|wander|enter|go|walk|move|travel|head|cross|approach|leave|exit|climb|descend)\b/i.test(cmd)) return 'EXPLORE';
  if (/\b(talk|speak|ask|call|shout|yell|whisper|listen|hello|hey)\b/i.test(cmd)) return 'TALK';
  if (/\b(rest|sleep|sit|wait|hide|smoke|drink|eat)\b/i.test(cmd)) return 'REST';
  if (/\b(fix|repair|patch|connect|wire|pipe|tape|rig|build|use|turn|switch|plug)\b/i.test(cmd)) return 'INTERACT';
  return 'GENERAL';
}

function detectLocation(cmd) {
  if (/hospital|ward|clinic|emergency|staff\s*room/i.test(cmd)) return 'HOSPITAL';
  if (/basement|cellar|underground|below/i.test(cmd)) return 'BASEMENT';
  if (/street|road|block|avenue|outside|sidewalk/i.test(cmd)) return 'STREET';
  if (/alley|alleyway|back\s*alley|dumpster/i.test(cmd)) return 'ALLEY';
  if (/subway|metro|train|platform|tunnel/i.test(cmd)) return 'SUBWAY';
  if (/bar|pub|tavern|lounge|dive/i.test(cmd)) return 'BAR';
  if (/apartment|flat|room|home|building|lobby|hallway|stairs/i.test(cmd)) return 'APARTMENT';
  if (/diner|restaurant|cafe|kitchen/i.test(cmd)) return 'DINER';
  if (/warehouse|factory|dock|pier|harbor|port/i.test(cmd)) return 'WAREHOUSE';
  if (/park|bridge|river|waterfront/i.test(cmd)) return 'PARK';
  if (/shop|store|bodega|laundromat|pawn/i.test(cmd)) return 'SHOP';
  if (/church|chapel|graveyard|cemetery/i.test(cmd)) return 'CHURCH';
  if (/phone|payphone|booth/i.test(cmd)) return 'PAYPHONE';
  if (/roof|rooftop|fire\s*escape/i.test(cmd)) return 'ROOFTOP';
  return null;
}

// ════════════════════════════════════════════════════════════════
//  DOM HELPERS
// ════════════════════════════════════════════════════════════════
function addLine(html, cls) {
  var div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  termEl.appendChild(div);
  termEl.scrollTop = termEl.scrollHeight;
  return div;
}

function showLoader() {
  var div = document.createElement('div');
  div.className = 'line'; div.id = 'ldr';
  div.innerHTML = '<span class="tag">[OSIRIS]:</span> <span style="color:#4a4030">...</span> <span class="dots"><i></i><i></i><i></i></span>';
  termEl.appendChild(div);
  termEl.scrollTop = termEl.scrollHeight;
}

function hideLoader() {
  var el = document.getElementById('ldr');
  if (el) el.remove();
}

function setOrb(state, ms) {
  ghostEl.className = state ? state : '';
  if (ms) setTimeout(function() { ghostEl.className = ''; }, ms);
}

function setLoc(name) {
  gameState.world.location = name;
  locEl.textContent = name;
}

function strikeHost() {
  ghostEl.style.top = 'calc(100% - 180px)';
  setOrb('deflect');
  setTimeout(function() {
    ghostEl.style.top = '14%';
    ghostEl.className = '';
  }, 1200);
}

function typeWrite(container, text) {
  return new Promise(function(resolve) {
    container.innerHTML = '<span class="tag">[OSIRIS]:</span> ';
    var span = document.createElement('span');
    container.appendChild(span);
    var cursor = document.createElement('span');
    cursor.className = 'typcur';
    container.appendChild(cursor);
    termEl.scrollTop = termEl.scrollHeight;
    var i = 0;
    function next() {
      if (i < text.length) {
        span.textContent += text.charAt(i);
        i++;
        termEl.scrollTop = termEl.scrollHeight;
        setTimeout(next, 28 + Math.random() * 20);
      } else {
        cursor.remove();
        resolve();
      }
    }
    next();
  });
}

var ERROR_MAP = {
  NO_KEY: 'No signal. Server is dark.',
  AUTH: 'Access denied. Wrong frequency.',
  NETWORK: 'Line is dead. No connection.',
  RATE_LIMIT: 'Too much noise on the wire. Wait.',
  BLOCKED: 'Signal jammed.',
  EMPTY: 'Nothing but static.',
  API_FAIL: 'The line crackled and went silent.'
};

function showError(code) {
  addLine('<span class="err">[STATIC]: ' + (ERROR_MAP[code] || ERROR_MAP.API_FAIL) + '</span>');
}

var FALLBACKS = {
  ATTACK_OSIRIS: ['You swing at the air. The flickering light doesn\'t flinch.', 'Your fist connects with nothing. I am not here. I am everywhere.', 'You can\'t hit the dark, friend.'],
  COMBAT: ['Knuckles on bone. Someone hits the ground.', 'The struggle is brief and ugly.', 'Blood on concrete. The city doesn\'t care.'],
  EXPLORE: ['Footsteps echo on wet pavement.', 'The streetlight flickers once, then steadies.', 'You keep walking. The silence keeps following.'],
  SEARCH: ['Your hands find dust and old paper.', 'Something rattles in the drawer.', 'Nothing useful. Just ghosts of a previous tenant.'],
  GENERAL: ['The radiator clicks.', 'A car passes somewhere outside. Then nothing.', 'The quiet presses in.']
};

function pickFallback(action) {
  var pool = FALLBACKS[action] || FALLBACKS.GENERAL;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ════════════════════════════════════════════════════════════════
//  INPUT HELPERS
// ════════════════════════════════════════════════════════════════
function waitForInput(placeholder) {
  return new Promise(function(resolve) {
    inpEl.placeholder = placeholder || 'Type here...';
    inpEl.disabled = false;
    inpEl.value = '';
    inpEl.focus();
    function handler(e) {
      if (e.key === 'Enter' && inpEl.value.trim()) {
        var val = inpEl.value.trim();
        inpEl.removeEventListener('keydown', handler);
        inpEl.disabled = true;
        inpEl.value = '';
        resolve(val);
      }
    }
    inpEl.addEventListener('keydown', handler);
  });
}

function waitForChoice(options) {
  return new Promise(function(resolve) {
    inpEl.disabled = true;
    var row = document.createElement('div');
    row.className = 'line';
    var inner = document.createElement('div');
    inner.className = 'choice-row';
    options.forEach(function(opt) {
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.addEventListener('click', function() {
        inner.querySelectorAll('.choice-btn').forEach(function(b) {
          b.disabled = true; b.style.opacity = '.2'; b.style.cursor = 'default';
        });
        btn.style.opacity = '1';
        btn.style.borderColor = '#e8a832';
        btn.style.color = '#e8a832';
        resolve(opt);
      });
      inner.appendChild(btn);
    });
    row.appendChild(inner);
    termEl.appendChild(row);
    termEl.scrollTop = termEl.scrollHeight;
  });
}

// ════════════════════════════════════════════════════════════════
//  CHARACTER CREATION
// ════════════════════════════════════════════════════════════════
async function beginCharacterCreation() {
  function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  addLine('<b>[SIGNAL ACQUIRED]</b>', 'sys');
  await wait(500);
  addLine('<span class="sys">Frequency locked. Somewhere in America, 1986.</span>');
  await wait(800);

  setOrb('thinking');

  var g = addLine('');
  await typeWrite(g, "You're awake. Good. Most don't make it past the silence. Before we go any further, I need to know who I'm watching.");
  await wait(600);
  ghostEl.className = '';

  // ── Question 1: Sex ──
  addLine('<span class="sys">— IDENTIFY YOURSELF —</span>');
  await wait(300);
  var q1 = addLine('');
  await typeWrite(q1, "Man or woman? The city doesn't care, but I do.");

  var sex = await waitForChoice(['MALE', 'FEMALE']);
  addLine('> ' + sex, 'usr');
  gameState.character.sex = sex.toLowerCase();
  await wait(400);

  var r1 = addLine('');
  await typeWrite(r1, "Noted. Won't matter much where you're going. But it's a start.");
  await wait(500);

  // ── Question 2: Age ──
  addLine('<span class="sys">— AGE —</span>');
  await wait(300);
  var q2 = addLine('');
  await typeWrite(q2, "How old are you? And don't lie. I can hear it in the static.");

  var age = await waitForInput('Enter your age...');
  addLine('> ' + age, 'usr');
  gameState.character.age = age;
  await wait(400);

  var r2 = addLine('');
  await typeWrite(r2, age + " years on the clock. Still some road left. Maybe.");
  await wait(500);

  // ── Question 3: Life Role ──
  addLine('<span class="sys">— THE QUESTION THAT MATTERS —</span>');
  await wait(300);
  var q3 = addLine('');
  await typeWrite(q3, "What was your life before the silence? What did you do?");
  await wait(200);
  addLine('<span class="hint">(Type anything: nurse, plumber, mechanic, student, thief, cop, drifter, teacher, soldier...)</span>');

  var lifeRole = await waitForInput('What were you?');
  addLine('> ' + lifeRole, 'usr');
  gameState.character.lifeRole = lifeRole.toLowerCase().trim();
  await wait(400);

  setOrb('thinking');
  var r3 = addLine('');
  await typeWrite(r3, "A " + gameState.character.lifeRole + ". That explains the hands. And the look in your eyes. Alright. Let's see where that takes us.");
  await wait(500);
  ghostEl.className = '';

  // ── City selection ──
  addLine('<span class="sys">— LOCATION —</span>');
  await wait(300);
  var q4 = addLine('');
  await typeWrite(q4, "Where did the silence find you?");

  var city = await waitForChoice(['NEW YORK', 'CLEVELAND', 'CHICAGO']);
  addLine('> ' + city, 'usr');
  gameState.world.city = city;
  await wait(400);

  var r4 = addLine('');
  var cityLines = {
    'NEW YORK': "New York. Millions of people and not a single one left. Figures.",
    'CLEVELAND': "Cleveland. Rust belt heart. The factories went quiet a long time ago. Now everything else has too.",
    'CHICAGO': "Chicago. The wind off the lake still cuts. But there's nobody left to feel it. Except you."
  };
  await typeWrite(r4, cityLines[city]);
  await wait(600);

  // ── Save ──
  gameState.world.chapter = 1;
  gameState.world.location = 'UNKNOWN';
  gameState.summary = gameState.character.sex + ', age ' + gameState.character.age + ', former ' + gameState.character.lifeRole + '. ' + city + ', 1986. Just woke up. The world is silent and empty. Chapter 1 beginning.';
  saveGame();

  addLine('<span class="sys">— CHAPTER 1 —</span>');
  await wait(800);

  await generateChapterOne();
}

// ════════════════════════════════════════════════════════════════
//  PERSONALIZED CHAPTER 1
// ════════════════════════════════════════════════════════════════
async function generateChapterOne() {
  function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  setOrb('thinking');
  showLoader();

  var role = gameState.character.lifeRole;
  var city = gameState.world.city;

  var prompt = '[SYSTEM: Generate the Chapter 1 opening. ' +
    'The player is a ' + gameState.character.sex + ', age ' + gameState.character.age +
    ', who was a "' + role + '" in ' + city + ', 1986. ' +
    'Everyone has vanished. The world is empty and silent. ' +
    'Create a dramatic, personal opening scene that connects their job (' + role + ') to where they wake up. ';

  // Specific starting location hints based on role
  if (/nurse|doctor|medic|paramedic|surgeon|emt/i.test(role)) {
    prompt += 'They wake up alone in a hospital staff room. Fluorescent light buzzing. Coffee cold on the counter. ' +
      'Set the location to HOSPITAL. ';
  } else if (/plumber|electrician|maintenance|janitor|handyman/i.test(role)) {
    prompt += 'They wake up in a dark, wet basement of an old building. Dripping pipes. A single bare bulb flickering. ' +
      'Set the location to BASEMENT. ';
  } else {
    prompt += 'Create a lonely, haunting 1980s starting scene appropriate for a ' + role + '. ' +
      'Think about where a ' + role + ' would be when the silence hit. ';
  }

  prompt += 'Describe the smell, the light, the sounds. 3-4 sentences. Cinematic. Gritty. ' +
    'End with a subtle hint to explore or investigate. ' +
    'Also respond with a LOCATION tag on a new line at the very end like this: [LOCATION:PLACE_NAME] ' +
    'where PLACE_NAME is a short all-caps label for where they are.]';

  var result = await callOsiris(prompt, 'SYSTEM', 'chapter1_opening');
  hideLoader();
  ghostEl.className = '';

  if (result.ok) {
    // Extract location tag if the AI included one
    var locMatch = result.text.match(/\[LOCATION:([A-Z_]+)\]/);
    var cleanText = result.text.replace(/\[LOCATION:[A-Z_]+\]/g, '').trim();

    if (locMatch && locMatch[1]) {
      setLoc(locMatch[1]);
    } else if (/nurse|doctor|medic|paramedic|surgeon|emt/i.test(role)) {
      setLoc('HOSPITAL');
    } else if (/plumber|electrician|maintenance|janitor|handyman/i.test(role)) {
      setLoc('BASEMENT');
    } else {
      setLoc('UNKNOWN');
    }

    var div = addLine('');
    await typeWrite(div, cleanText);
  } else {
    // Hardcoded fallback
    if (/nurse|doctor|medic/i.test(role)) {
      setLoc('HOSPITAL');
      var fb = addLine('');
      await typeWrite(fb, "The fluorescent light above you buzzes like a trapped insect. You're on the break room floor of St. Mary's, " + city + ". The coffee on the counter is cold. The hallways are empty. Everyone is gone.");
    } else if (/plumber|electrician|maintenance/i.test(role)) {
      setLoc('BASEMENT');
      var fb = addLine('');
      await typeWrite(fb, "Water drips somewhere in the dark. You're in a basement, tools scattered around you, a single bulb swinging overhead. The building above is silent. The whole city is silent.");
    } else {
      setLoc('UNKNOWN');
      var fb = addLine('');
      await typeWrite(fb, "You wake up alone. " + city + ", 1986. The streets outside are empty. No cars. No voices. Just the hum of a payphone off the hook somewhere down the block. You were a " + role + ". Now you're something else.");
    }
    showError(result.error);
  }

  await wait(300);
  addLine('<span style="color:#e8a832;font-size:.75rem">CHAPTER 1 — THE SILENCE</span>', 'sys');
  await wait(200);
  addLine('<span class="hint">(Try: <b>look around</b> · <b>search the room</b> · <b>go outside</b> · <b>listen</b>)</span>');

  startGameLoop();
}

// ════════════════════════════════════════════════════════════════
//  CONTINUE — load saved game
// ════════════════════════════════════════════════════════════════
async function bootContinue() {
  function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  addLine('<b>[SIGNAL ACQUIRED]</b>', 'sys');
  await wait(400);
  addLine('<span class="sys">Save data found. Reconnecting...</span>');
  await wait(600);

  setOrb('thinking');
  showLoader();

  var prompt = '[SYSTEM: The player is returning. ' +
    'They are a ' + gameState.character.sex + ', age ' + gameState.character.age +
    ', former ' + gameState.character.lifeRole + '. ' +
    gameState.world.city + ', 1986. ' +
    'Location: ' + gameState.world.location + '. Chapter: ' + gameState.world.chapter + '. ' +
    'Story so far: ' + (gameState.summary || 'Early in the silence.') + ' ' +
    'Welcome them back as OSIRIS. 2-3 sentences. Gritty, cold, 1980s. Remind them where they are.]';

  var result = await callOsiris(prompt, 'SYSTEM', 'continue');
  hideLoader();
  ghostEl.className = '';

  if (result.ok) {
    var div = addLine('');
    await typeWrite(div, result.text);
  } else {
    var fb = addLine('');
    await typeWrite(fb, "You're back. Still in " + gameState.world.location.replace(/_/g, ' ').toLowerCase() + ". Still alone. The silence didn't forget you, " + gameState.character.lifeRole + ".");
    showError(result.error);
  }

  await wait(300);
  addLine('<span style="color:#e8a832;font-size:.75rem">SIGNAL RESTORED</span>', 'sys');
  addLine('<span class="hint">(Try: <b>look around</b> · <b>search</b> · <b>go outside</b> · <b>listen</b>)</span>');

  startGameLoop();
}

// ════════════════════════════════════════════════════════════════
//  MAIN GAME LOOP
// ════════════════════════════════════════════════════════════════
function startGameLoop() {
  locked = false;
  inpEl.disabled = false;
  inpEl.placeholder = 'What do you do...';
  inpEl.focus();
  inpEl.addEventListener('keydown', gameInputHandler);
}

function gameInputHandler(e) {
  if (e.key === 'Enter') processCommand(inpEl.value);
}

async function processCommand(rawText) {
  if (!rawText.trim() || locked) return;
  locked = true;
  inpEl.value = '';
  inpEl.disabled = true;

  addLine('> ' + rawText, 'usr');
  var cmd = rawText.toLowerCase().trim();
  var action = classifyAction(cmd);

  // Location
  var newLoc = detectLocation(cmd);
  if (newLoc && newLoc !== gameState.world.location) {
    setLoc(newLoc);
    addLine('<span class="sys">— ' + newLoc + ' —</span>');
  }

  // Orb visuals
  if (action === 'ATTACK_OSIRIS') {
    strikeHost();
    addLine('<span class="action">[OSIRIS]: You can\'t hit what isn\'t there.</span>');
  } else if (action === 'COMBAT') {
    setOrb('combat', 2800);
  } else if (action === 'EXPLORE' || action === 'SEARCH') {
    setOrb('explore', 3500);
  } else {
    setOrb('thinking');
  }

  showLoader();
  var result = await callOsiris(rawText, action);
  hideLoader();

  if (result.ok) {
    if (action !== 'COMBAT' && action !== 'EXPLORE' && action !== 'SEARCH' && action !== 'ATTACK_OSIRIS') {
      ghostEl.className = '';
    }
    var msgDiv = addLine('');
    await typeWrite(msgDiv, result.text);
  } else {
    ghostEl.className = '';
    showError(result.error);
    addLine('<span class="tag">[OSIRIS]:</span> ' + pickFallback(action));
  }

  setTimeout(function() { ghostEl.className = ''; }, 4000);
  locked = false;
  inpEl.disabled = false;
  inpEl.focus();
}
