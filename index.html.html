<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIRIS | Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050505;color:#fff;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ═══ GHOST ORB ═══ */
  #ghost{
    position:fixed;top:14%;right:9%;width:100px;height:100px;
    border-radius:50%;display:flex;justify-content:center;align-items:center;
    z-index:100;cursor:default;
    background:linear-gradient(45deg,#00f2ff,#ff00ff);
    box-shadow:0 0 40px rgba(0,242,255,.4),0 0 80px rgba(255,0,255,.15);
    animation:orbFloat 4s ease-in-out infinite;
    transition:top .5s cubic-bezier(.175,.885,.32,1.275);
  }
  .eye{width:10px;height:10px;background:#fff;border-radius:50%;margin:5px;box-shadow:0 0 10px #fff}
  @keyframes orbFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(5deg)}}

  #ghost.thinking{
    box-shadow:0 0 60px rgba(0,242,255,.65),0 0 130px rgba(255,0,255,.3);
    animation:orbFloat 4s ease-in-out infinite,orbPulse 1.1s ease-in-out infinite;
  }
  @keyframes orbPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.12)}}

  #ghost.combat{
    background:linear-gradient(45deg,#ff0044,#ff6600)!important;
    box-shadow:0 0 50px rgba(255,0,68,.6)!important;
    animation:orbGlitch .12s ease-in-out 5,orbFloat 4s ease-in-out infinite!important;
  }
  @keyframes orbGlitch{
    0%{transform:translate(0) scale(1)}25%{transform:translate(8px,-6px) scale(1.08)}
    50%{transform:translate(-10px,4px) scale(.94)}75%{transform:translate(5px,7px) scale(1.06)}100%{transform:translate(0) scale(1)}
  }

  #ghost.explore{
    background:linear-gradient(45deg,#00ffa3,#00b4ff)!important;
    box-shadow:0 0 50px rgba(0,255,163,.35),0 0 90px rgba(0,180,255,.15)!important;
    animation:orbFloat 5s ease-in-out infinite!important;
  }

  #ghost.deflect{
    background:#fff!important;box-shadow:0 0 90px rgba(255,255,255,.7)!important;
    animation:orbDeflect .25s ease-in-out 3!important;
  }
  @keyframes orbDeflect{0%,100%{transform:scale(1)}50%{transform:scale(1.3) rotate(8deg)}}

  /* ═══ TERMINAL ═══ */
  #terminal{
    flex:1;overflow-y:auto;padding:60px 15% 20px;
    display:flex;flex-direction:column;gap:20px;scrollbar-width:none;
  }
  #terminal::-webkit-scrollbar{display:none}

  .line{font-size:1.25rem;line-height:1.7;max-width:900px;animation:fadeUp .4s ease-out forwards;opacity:0}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .usr{color:#666;font-style:italic}
  .sys{color:#444;font-size:.95rem;letter-spacing:.05em}
  .err{color:#ff3355;font-size:.95rem}
  .tag{color:#00f2ff;font-weight:600}
  .action{color:#ff9900;font-weight:500}
  .dmg{color:#ff3355}
  .hint{font-size:.82rem;color:#333;margin-top:3px}

  .dots{display:inline-flex;gap:5px;align-items:center}
  .dots i{width:5px;height:5px;background:rgba(0,242,255,.5);border-radius:50%;animation:dotAnim 1.4s ease-in-out infinite;display:block}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dotAnim{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.3)}}

  .typcur{display:inline-block;width:2px;height:1.1em;background:#00f2ff;margin-left:2px;vertical-align:text-bottom;animation:curBlink .7s step-end infinite}
  @keyframes curBlink{0%,100%{opacity:1}50%{opacity:0}}

  /* ═══ BOTTOM BAR ═══ */
  #bar{height:100px;background:rgba(0,0,0,.92);border-top:1px solid #222;display:flex;align-items:center;padding:0 15%;flex-shrink:0}
  #loc{color:#00f2ff;font-weight:800;letter-spacing:4px;margin-right:40px;font-size:.9rem;white-space:nowrap;user-select:none}
  #inp{background:0;border:0;color:#fff;font-size:1.2rem;flex:1;outline:0;font-family:inherit;font-weight:300;caret-color:#00f2ff}
  #inp::placeholder{color:#2a2a2a}
  #inp:disabled{opacity:.35}

  @media(max-width:768px){
    #terminal{padding:35px 5% 12px}
    #bar{padding:0 5%;height:75px}
    #loc{letter-spacing:2px;font-size:.68rem;margin-right:14px}
    #inp{font-size:1rem}
    .line{font-size:1.02rem}
    #ghost{width:58px;height:58px;top:6%;right:4%}
    .eye{width:7px;height:7px;margin:3px}
  }
  @media(max-width:400px){
    #terminal{padding:25px 4% 10px}
    #bar{padding:0 4%;height:65px}
    #loc{font-size:.6rem;letter-spacing:1.5px;margin-right:10px}
    .line{font-size:.95rem}
  }
</style>
</head>
<body>

<div id="ghost"><div class="eye"></div><div class="eye"></div></div>
<div id="terminal"></div>
<div id="bar">
  <div id="loc">VOID_LOBBY</div>
  <input type="text" id="inp" placeholder="Type a command..." autofocus autocomplete="off" spellcheck="false">
</div>

<script>
// ════════════════════════════════════════════════
//  OSIRIS FRONTEND — calls /api/osiris on the backend
//  NO API key in the browser. Ever.
// ════════════════════════════════════════════════
var termEl = document.getElementById('terminal');
var inpEl = document.getElementById('inp');
var ghostEl = document.getElementById('ghost');
var locEl = document.getElementById('loc');

var locked = false;
var curLoc = 'VOID_LOBBY';
var chatHistory = []; // {role, text} pairs sent to backend

// ════════════════════════════════════════════════
//  BACKEND API CALL — simple POST to our server
// ════════════════════════════════════════════════
async function callOsiris(userInput, actionLabel) {
  var payload = {
    input: userInput,
    location: curLoc,
    action: actionLabel,
    history: chatHistory.slice(-30)
  };

  try {
    var res = await fetch('/api/osiris', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    var data = await res.json();

    if (data.ok && data.text) {
      // Store in history for context
      chatHistory.push({ role: 'user', text: userInput });
      chatHistory.push({ role: 'model', text: data.text });
      if (chatHistory.length > 60) chatHistory = chatHistory.slice(-60);
      return { ok: true, text: data.text };
    }

    return { ok: false, error: data.error || 'API_FAIL' };
  } catch (e) {
    console.error('[OSIRIS] Fetch error:', e.message);
    return { ok: false, error: 'NETWORK' };
  }
}

// ════════════════════════════════════════════════
//  INTENT DETECTION
// ════════════════════════════════════════════════
function classifyAction(cmd) {
  if (/\b(attack|hit|fight|kill|strike|punch|destroy)\s*(osiris|ghost|host|you|the ghost|the orb)/i.test(cmd)) return 'ATTACK_OSIRIS';
  if (/\b(attack|fight|strike|hit|slash|shoot|kill|stab|punch|kick|cast|fire|block|parry)\b/i.test(cmd)) return 'COMBAT';
  if (/\b(loot|open|grab|take|pick|steal|collect|gather|chest|crate|scavenge)\b/i.test(cmd)) return 'LOOT';
  if (/\b(explore|look|examine|search|inspect|wander|enter|go|walk|move|travel|head|venture|scout|approach|around)\b/i.test(cmd)) return 'EXPLORE';
  if (/\b(talk|speak|ask|greet|whisper|shout|negotiate|barter|hail)\b/i.test(cmd)) return 'TALK';
  if (/\b(rest|sleep|camp|wait|heal|meditate|sit)\b/i.test(cmd)) return 'REST';
  return 'GENERAL';
}

function detectLocation(cmd) {
  if (/neon|city|street|district/i.test(cmd)) return 'NEON_DISTRICT';
  if (/rust|market|bazaar|trade/i.test(cmd)) return 'RUST_BAZAAR';
  if (/echo|sanctum|temple/i.test(cmd)) return 'ECHO_SANCTUM';
  if (/data|catacomb|underground|deep/i.test(cmd)) return 'DATA_CATACOMBS';
  if (/harbor|drift|sea|ship|shore/i.test(cmd)) return 'DRIFT_HARBOR';
  if (/spire|phantom|tower|climb/i.test(cmd)) return 'PHANTOM_SPIRE';
  if (/void|lobby|home|return|back/i.test(cmd)) return 'VOID_LOBBY';
  return null;
}

// ════════════════════════════════════════════════
//  DOM HELPERS
// ════════════════════════════════════════════════
function addLine(html, cls) {
  var div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  termEl.appendChild(div);
  termEl.scrollTop = termEl.scrollHeight;
  return div;
}

function showLoader() {
  var div = document.createElement('div');
  div.className = 'line'; div.id = 'ldr';
  div.innerHTML = '<span class="tag">[OSIRIS]:</span> <span style="color:#555">System processing</span> <span class="dots"><i></i><i></i><i></i></span>';
  termEl.appendChild(div);
  termEl.scrollTop = termEl.scrollHeight;
}

function hideLoader() {
  var el = document.getElementById('ldr');
  if (el) el.remove();
}

function setOrb(state, ms) {
  ghostEl.className = state ? state : '';
  if (ms) setTimeout(function() { ghostEl.className = ''; }, ms);
}

function setLoc(name) {
  curLoc = name;
  locEl.textContent = name;
}

function strikeHost() {
  ghostEl.style.top = 'calc(100% - 200px)';
  setOrb('deflect');
  setTimeout(function() {
    ghostEl.style.top = '14%';
    ghostEl.className = '';
  }, 1200);
}

// Typewriter
function typeWrite(container, text) {
  return new Promise(function(resolve) {
    container.innerHTML = '<span class="tag">[OSIRIS]:</span> ';
    var span = document.createElement('span');
    container.appendChild(span);
    var cursor = document.createElement('span');
    cursor.className = 'typcur';
    container.appendChild(cursor);
    termEl.scrollTop = termEl.scrollHeight;
    var i = 0;
    function next() {
      if (i < text.length) {
        span.textContent += text.charAt(i);
        i++;
        termEl.scrollTop = termEl.scrollHeight;
        setTimeout(next, 25 + Math.random() * 18);
      } else {
        cursor.remove();
        resolve();
      }
    }
    next();
  });
}

// Errors
var ERROR_MAP = {
  NO_KEY: 'Server has no API key configured. Check .env file.',
  AUTH: 'API key is invalid or disabled.',
  NETWORK: 'Cannot reach server. Is it running on localhost:3000?',
  RATE_LIMIT: 'Too many requests. Wait a moment.',
  BLOCKED: 'Response filtered by safety protocols.',
  EMPTY: 'OSIRIS returned silence.',
  API_FAIL: 'Neural link unstable. Check server logs.'
};

function showError(code) {
  addLine('<span class="err"><b>[SYSTEM ERROR]:</b> ' + (ERROR_MAP[code] || ERROR_MAP.API_FAIL) + '</span>');
}

// Fallbacks
var FALLBACKS = {
  ATTACK_OSIRIS: ['I am code, not flesh. Your blade passes through me like light through glass.', 'Amusing. You cannot kill what was never alive.', 'I exist between the lines. Your weapon has no syntax for that.'],
  COMBAT: ['Steel meets data. The simulation trembles.', 'A clean strike. The system registers the impact.', 'The creature recoils. You press forward.'],
  EXPLORE: ['The path shifts as you walk.', 'New geometry renders around you.', 'You push deeper. The world pushes back.'],
  LOOT: ['Fragments of corrupted data. Useful, perhaps.', 'The container yields its contents reluctantly.', 'Something glints in the debris.'],
  GENERAL: ['The terminal hums.', 'The void absorbs your words.', 'Your signal echoes and fades.']
};

function pickFallback(action) {
  var pool = FALLBACKS[action] || FALLBACKS.GENERAL;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ════════════════════════════════════════════════
//  MAIN GAME LOOP
// ════════════════════════════════════════════════
async function processCommand(rawText) {
  if (!rawText.trim() || locked) return;
  locked = true;
  inpEl.value = '';
  inpEl.disabled = true;

  addLine('> ' + rawText, 'usr');
  var cmd = rawText.toLowerCase().trim();
  var action = classifyAction(cmd);

  // Location
  var newLoc = detectLocation(cmd);
  if (newLoc && newLoc !== curLoc) {
    setLoc(newLoc);
    addLine('<span class="sys">— SECTOR SHIFT: ' + curLoc + ' —</span>');
  }

  // Visuals per action
  if (action === 'ATTACK_OSIRIS') {
    strikeHost();
    addLine('<span class="action">[SYSTEM]: Attack deflected. OSIRIS is immortal code.</span>');
  } else if (action === 'COMBAT') {
    setOrb('combat', 2800);
    addLine('<span class="dmg">[COMBAT]: You launch your attack!</span>');
  } else if (action === 'EXPLORE' || action === 'LOOT') {
    setOrb('explore', 3500);
  } else {
    setOrb('thinking');
  }

  // Call backend
  showLoader();
  var result = await callOsiris(rawText, action);
  hideLoader();

  if (result.ok) {
    if (action !== 'COMBAT' && action !== 'EXPLORE' && action !== 'LOOT' && action !== 'ATTACK_OSIRIS') {
      ghostEl.className = '';
    }
    var msgDiv = addLine('');
    await typeWrite(msgDiv, result.text);
  } else {
    ghostEl.className = '';
    showError(result.error);
    addLine('<span class="tag">[OSIRIS]:</span> ' + pickFallback(action));
  }

  setTimeout(function() { ghostEl.className = ''; }, 4000);
  locked = false;
  inpEl.disabled = false;
  inpEl.focus();
}

inpEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') processCommand(inpEl.value);
});

// ════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════
async function boot() {
  function wait(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  await wait(400);
  addLine('<b>[SYSTEM INITIALIZED]</b>', 'sys');
  await wait(500);
  addLine('<span class="sys">Establishing neural link to server...</span>');
  await wait(800);

  setOrb('thinking');
  showLoader();

  var result = await callOsiris(
    '[SYSTEM: A new player just connected. Greet them as OSIRIS. Tell them they stand in the Void Lobby. Hint they can explore, fight creatures, loot, or talk to you. Be mysterious. 2-3 sentences.]',
    'SYSTEM'
  );

  hideLoader();
  ghostEl.className = '';

  if (result.ok) {
    var div = addLine('');
    await typeWrite(div, result.text);
    await wait(300);
    addLine('<span style="color:#00f2ff;font-size:.78rem">NEURAL LINK: ACTIVE — LIVE AI</span>', 'sys');
  } else {
    var d1 = addLine('');
    await typeWrite(d1, "You're here. Good. Most don't make it past the static.");
    await wait(600);
    var d2 = addLine('');
    await typeWrite(d2, "I am OSIRIS — the watcher, the narrator, the immortal host. This simulation bends to my will.");
    await wait(300);
    showError(result.error);
    addLine('<span style="color:#ff9900;font-size:.78rem">NEURAL LINK: OFFLINE — LOCAL MODE</span>', 'sys');
  }

  await wait(300);
  addLine('<span class="hint">(Try: <b>explore neon district</b> · <b>attack data-wolf</b> · <b>loot the chest</b> · <b>attack osiris</b>)</span>');
  inpEl.focus();
}

boot();
</script>
</body>
</html>
