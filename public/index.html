<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIRIS | Terminal</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050505;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ═══ GHOST ORB ═══ */
  #ghost{
    position:fixed;top:14%;right:9%;width:100px;height:100px;
    border-radius:50%;display:none;justify-content:center;align-items:center;
    z-index:100;cursor:default;
    background:linear-gradient(45deg,#00f2ff,#ff00ff);
    box-shadow:0 0 40px rgba(0,242,255,.4),0 0 80px rgba(255,0,255,.15);
    animation:orbFloat 4s ease-in-out infinite;
    transition:top .5s cubic-bezier(.175,.885,.32,1.275);
  }
  .eye{width:10px;height:10px;background:#fff;border-radius:50%;margin:5px;box-shadow:0 0 10px #fff}
  @keyframes orbFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(5deg)}}

  #ghost.thinking{
    box-shadow:0 0 60px rgba(0,242,255,.65),0 0 130px rgba(255,0,255,.3);
    animation:orbFloat 4s ease-in-out infinite,orbPulse 1.1s ease-in-out infinite;
  }
  @keyframes orbPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.12)}}

  #ghost.combat{
    background:linear-gradient(45deg,#ff0044,#ff6600)!important;
    box-shadow:0 0 50px rgba(255,0,68,.6)!important;
    animation:orbGlitch .12s ease-in-out 5,orbFloat 4s ease-in-out infinite!important;
  }
  @keyframes orbGlitch{
    0%{transform:translate(0) scale(1)}25%{transform:translate(8px,-6px) scale(1.08)}
    50%{transform:translate(-10px,4px) scale(.94)}75%{transform:translate(5px,7px) scale(1.06)}
    100%{transform:translate(0) scale(1)}
  }

  #ghost.explore{
    background:linear-gradient(45deg,#00ffa3,#00b4ff)!important;
    box-shadow:0 0 50px rgba(0,255,163,.35),0 0 90px rgba(0,180,255,.15)!important;
    animation:orbFloat 5s ease-in-out infinite!important;
  }

  #ghost.deflect{
    background:#fff!important;box-shadow:0 0 90px rgba(255,255,255,.7)!important;
    animation:orbDeflect .25s ease-in-out 3!important;
  }
  @keyframes orbDeflect{0%,100%{transform:scale(1)}50%{transform:scale(1.3) rotate(8deg)}}

  /* ═══ MAIN MENU ═══ */
  #menu-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;
    background:#050505;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    transition:opacity .8s ease;
  }
  #menu-screen.hidden{opacity:0;pointer-events:none}

  .menu-title{
    font-size:4rem;font-weight:800;letter-spacing:12px;
    background:linear-gradient(90deg,#00f2ff,#ff00ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:10px;user-select:none;
    animation:menuPulse 3s ease-in-out infinite;
  }
  @keyframes menuPulse{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.85;filter:brightness(1.2)}}
  .menu-subtitle{color:#333;font-size:.85rem;letter-spacing:6px;margin-bottom:60px;user-select:none}
  .menu-doors{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}

  .door{
    width:180px;height:240px;border:1px solid #1a1a1a;
    background:linear-gradient(180deg,#0a0a0a,#111);border-radius:8px;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding-bottom:28px;cursor:pointer;position:relative;overflow:hidden;transition:all .35s ease;
  }
  .door:hover{border-color:#00f2ff;box-shadow:0 0 30px rgba(0,242,255,.15);transform:translateY(-4px)}
  .door:active{transform:translateY(0)}
  .door-glow{
    position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);
    width:50px;height:50px;border-radius:50%;filter:blur(25px);opacity:.3;transition:opacity .35s;
  }
  .door:hover .door-glow{opacity:.6}
  .door-label{font-size:.85rem;font-weight:600;letter-spacing:3px;color:#555;transition:color .35s;position:relative;z-index:1}
  .door:hover .door-label{color:#fff}
  .door-num{font-size:2.5rem;font-weight:800;color:#111;margin-bottom:14px;transition:color .35s;position:relative;z-index:1}
  .door:hover .door-num{color:#222}
  .door.disabled{opacity:.25;cursor:not-allowed}
  .door.disabled:hover{border-color:#1a1a1a;box-shadow:none;transform:none}
  .door-new .door-glow{background:#00f2ff}
  .door-continue .door-glow{background:#ff9900}
  .door-credits .door-glow{background:#ff00ff}

  /* ═══ CREDITS ═══ */
  #credits-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:250;
    background:rgba(5,5,5,.95);display:none;justify-content:center;align-items:center;flex-direction:column;
  }
  #credits-overlay.show{display:flex}
  .credits-text{color:#444;font-size:1rem;line-height:2.2;text-align:center;letter-spacing:2px}
  .credits-text span{color:#00f2ff}
  .credits-close{margin-top:40px;color:#333;font-size:.75rem;letter-spacing:4px;cursor:pointer;transition:color .3s}
  .credits-close:hover{color:#fff}

  /* ═══ TERMINAL ═══ */
  #terminal{
    flex:1;overflow-y:auto;padding:60px 15% 20px;
    display:none;flex-direction:column;gap:20px;scrollbar-width:none;
  }
  #terminal::-webkit-scrollbar{display:none}
  .line{font-size:1.25rem;line-height:1.7;max-width:900px;animation:fadeUp .4s ease-out forwards;opacity:0}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .usr{color:#666;font-style:italic}
  .sys{color:#444;font-size:.95rem;letter-spacing:.05em}
  .err{color:#ff3355;font-size:.95rem}
  .tag{color:#00f2ff;font-weight:600}
  .action{color:#ff9900;font-weight:500}
  .dmg{color:#ff3355}
  .hint{font-size:.82rem;color:#333;margin-top:3px}

  .choice-row{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
  .choice-btn{
    background:transparent;border:1px solid #222;color:#555;
    padding:8px 22px;border-radius:4px;font-family:inherit;font-size:.9rem;
    cursor:pointer;letter-spacing:1px;transition:all .25s ease;
  }
  .choice-btn:hover{border-color:#00f2ff;color:#00f2ff;box-shadow:0 0 15px rgba(0,242,255,.1)}

  .dots{display:inline-flex;gap:5px;align-items:center}
  .dots i{width:5px;height:5px;background:rgba(0,242,255,.5);border-radius:50%;animation:dotAnim 1.4s ease-in-out infinite;display:block}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dotAnim{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.3)}}

  .typcur{display:inline-block;width:2px;height:1.1em;background:#00f2ff;margin-left:2px;vertical-align:text-bottom;animation:curBlink .7s step-end infinite}
  @keyframes curBlink{0%,100%{opacity:1}50%{opacity:0}}

  /* ═══ BOTTOM BAR ═══ */
  #bar{
    height:100px;background:rgba(0,0,0,.92);border-top:1px solid #222;
    display:none;align-items:center;padding:0 15%;flex-shrink:0;
  }
  #loc{color:#00f2ff;font-weight:800;letter-spacing:4px;margin-right:40px;font-size:.9rem;white-space:nowrap;user-select:none}
  #inp{background:0;border:0;color:#fff;font-size:1.2rem;flex:1;outline:0;font-family:inherit;font-weight:300;caret-color:#00f2ff}
  #inp::placeholder{color:#2a2a2a}
  #inp:disabled{opacity:.35}

  @media(max-width:768px){
    .menu-title{font-size:2.4rem;letter-spacing:6px}
    .menu-subtitle{font-size:.65rem;letter-spacing:4px;margin-bottom:40px}
    .door{width:140px;height:190px;padding-bottom:20px}
    .door-num{font-size:2rem;margin-bottom:10px}
    .door-label{font-size:.7rem;letter-spacing:2px}
    .menu-doors{gap:16px}
    #terminal{padding:35px 5% 12px}
    #bar{padding:0 5%;height:75px}
    #loc{letter-spacing:2px;font-size:.68rem;margin-right:14px}
    #inp{font-size:1rem}
    .line{font-size:1.02rem}
    #ghost{width:58px;height:58px;top:6%;right:4%}
    .eye{width:7px;height:7px;margin:3px}
  }
  @media(max-width:400px){
    #terminal{padding:25px 4% 10px}
    #bar{padding:0 4%;height:65px}
    #loc{font-size:.6rem;letter-spacing:1.5px;margin-right:10px}
    .line{font-size:.95rem}
    .menu-title{font-size:1.8rem;letter-spacing:4px}
    .door{width:120px;height:160px}
    .door-num{font-size:1.5rem}
  }

  /* ═══ OSIRIS VISUAL EFFECTS ═══ */

  /* Smoke particles — float upward from the orb */
  .smoke-particle{
    position:fixed;width:6px;height:6px;border-radius:50%;
    background:rgba(200,200,200,.25);pointer-events:none;z-index:99;
    animation:smokeRise 2.5s ease-out forwards;
  }
  @keyframes smokeRise{
    0%{opacity:.4;transform:translate(0,0) scale(1)}
    50%{opacity:.2;transform:translate(-15px,-60px) scale(2.5)}
    100%{opacity:0;transform:translate(-25px,-120px) scale(3.5)}
  }

  /* Sword flash — a bright slash across the orb */
  .sword-flash{
    position:fixed;width:120px;height:3px;pointer-events:none;z-index:99;
    background:linear-gradient(90deg,transparent,#fff,#ff4444,#fff,transparent);
    border-radius:2px;
    animation:slashAcross .3s ease-out forwards;
    box-shadow:0 0 15px rgba(255,68,68,.6);
  }
  @keyframes slashAcross{
    0%{opacity:1;transform:rotate(-25deg) scaleX(0);transform-origin:left center}
    60%{opacity:1;transform:rotate(-25deg) scaleX(1)}
    100%{opacity:0;transform:rotate(-25deg) scaleX(1.2)}
  }

  /* Glitch overlay on the orb — flicker effect */
  #ghost.vfx-glitch{
    animation:vfxGlitch .08s ease-in-out 6!important;
  }
  @keyframes vfxGlitch{
    0%{transform:translate(0,0);filter:hue-rotate(0deg)}
    25%{transform:translate(6px,-4px);filter:hue-rotate(90deg)}
    50%{transform:translate(-8px,3px);filter:hue-rotate(180deg)}
    75%{transform:translate(4px,5px);filter:hue-rotate(270deg)}
    100%{transform:translate(0,0);filter:hue-rotate(360deg)}
  }

  /* Mood glows — colored aura around the orb */
  #ghost.vfx-danger{
    background:linear-gradient(45deg,#ff0033,#cc0000)!important;
    box-shadow:0 0 50px rgba(255,0,51,.55),0 0 100px rgba(204,0,0,.25)!important;
  }
  #ghost.vfx-amused{
    background:linear-gradient(45deg,#bb44ff,#8800cc)!important;
    box-shadow:0 0 50px rgba(187,68,255,.45),0 0 100px rgba(136,0,204,.2)!important;
  }
  #ghost.vfx-impressed{
    background:linear-gradient(45deg,#00f2ff,#0088ff)!important;
    box-shadow:0 0 50px rgba(0,242,255,.5),0 0 100px rgba(0,136,255,.2)!important;
  }
  #ghost.vfx-calm{
    background:linear-gradient(45deg,#00f2ff,#ff00ff)!important;
    box-shadow:0 0 40px rgba(0,242,255,.35),0 0 80px rgba(255,0,255,.12)!important;
  }

  /* Approach — orb moves closer to the terminal center */
  #ghost.vfx-approach{
    top:35%!important;right:20%!important;
    transform:scale(1.15);
    transition:top .8s cubic-bezier(.175,.885,.32,1.275),right .8s ease,transform .8s ease!important;
  }

  /* Screen shake */
  @keyframes screenShake{
    0%{transform:translate(0,0)}
    10%{transform:translate(-3px,2px)}
    20%{transform:translate(4px,-2px)}
    30%{transform:translate(-2px,3px)}
    40%{transform:translate(3px,-1px)}
    50%{transform:translate(-1px,2px)}
    60%{transform:translate(2px,-3px)}
    70%{transform:translate(-3px,1px)}
    80%{transform:translate(1px,2px)}
    90%{transform:translate(-2px,-1px)}
    100%{transform:translate(0,0)}
  }
  body.vfx-shake{
    animation:screenShake .4s ease-in-out;
  }

  /* Ambient pulse — subtle breathing when OSIRIS is idle */
  #ghost.vfx-ambient{
    animation:orbFloat 4s ease-in-out infinite,ambientBreath 3s ease-in-out infinite!important;
  }
  @keyframes ambientBreath{
    0%,100%{box-shadow:0 0 40px rgba(0,242,255,.3),0 0 80px rgba(255,0,255,.1)}
    50%{box-shadow:0 0 55px rgba(0,242,255,.45),0 0 100px rgba(255,0,255,.18)}
  }

  /* OSIRIS idle drift — slow side-to-side floating */
  #ghost.vfx-idle-drift{
    animation:idleDrift 6s ease-in-out infinite,orbFloat 4s ease-in-out infinite!important;
  }
  @keyframes idleDrift{
    0%,100%{right:9%}
    25%{right:14%}
    50%{right:5%}
    75%{right:11%}
  }

  /* Idle spin */
  #ghost.vfx-idle-spin{
    animation:idleSpin .8s ease-in-out 1!important;
  }
  @keyframes idleSpin{
    0%{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(180deg) scale(.9)}
    100%{transform:rotate(360deg) scale(1)}
  }

  /* Idle flip upside down */
  #ghost.vfx-idle-flip{
    animation:idleFlip 2s ease-in-out 1!important;
  }
  @keyframes idleFlip{
    0%{transform:scaleY(1)}
    30%{transform:scaleY(-1)}
    70%{transform:scaleY(-1)}
    100%{transform:scaleY(1)}
  }

  /* Idle tap — small bounce toward screen */
  #ghost.vfx-idle-tap{
    animation:idleTap .3s ease-in-out 2!important;
  }
  @keyframes idleTap{
    0%,100%{transform:translateX(0)}
    50%{transform:translateX(-12px) scale(1.05)}
  }

  /* Idle juggle — bobbing motion */
  #ghost.vfx-idle-juggle{
    animation:idleJuggle .5s ease-in-out 3!important;
  }
  @keyframes idleJuggle{
    0%,100%{transform:translateY(0)}
    25%{transform:translateY(-18px)}
    75%{transform:translateY(8px)}
  }

  /* Idle kick — quick jolt */
  #ghost.vfx-idle-kick{
    animation:idleKick .25s ease-out 1!important;
  }
  @keyframes idleKick{
    0%{transform:translate(0,0)}
    50%{transform:translate(-20px,5px) scale(1.08)}
    100%{transform:translate(0,0)}
  }

  /* Ember glow — cigar tip effect */
  .ember-dot{
    position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:99;
    background:radial-gradient(circle,#ff8800,#ff4400);
    box-shadow:0 0 12px rgba(255,136,0,.6),0 0 25px rgba(255,68,0,.3);
    animation:emberGlow 1.5s ease-out forwards;
  }
  @keyframes emberGlow{
    0%{opacity:1;transform:scale(1)}
    50%{opacity:.7;transform:scale(1.3)}
    100%{opacity:0;transform:scale(.5)}
  }
</style>
</head>
<body>

<!-- ═══ MENU ═══ -->
<div id="menu-screen">
  <div class="menu-title">OSIRIS</div>
  <div class="menu-subtitle">THE LATTICE AWAITS</div>
  <div class="menu-doors">
    <div class="door door-new" id="door-new">
      <div class="door-glow"></div><div class="door-num">I</div><div class="door-label">NEW PLAYER</div>
    </div>
    <div class="door door-continue" id="door-continue">
      <div class="door-glow"></div><div class="door-num">II</div><div class="door-label">CONTINUE</div>
    </div>
    <div class="door door-credits" id="door-credits">
      <div class="door-glow"></div><div class="door-num">III</div><div class="door-label">CREDITS</div>
    </div>
  </div>
</div>

<!-- ═══ CREDITS ═══ -->
<div id="credits-overlay">
  <div class="credits-text">
    <span>OSIRIS</span><br>A game born in the Void<br><br>Created by [Your Name]<br>Narrated by OSIRIS<br><br><span>Version 1.0</span>
  </div>
  <div class="credits-close" id="credits-close-btn">[ RETURN ]</div>
</div>

<!-- ═══ GHOST ORB ═══ -->
<div id="ghost"><div class="eye"></div><div class="eye"></div></div>

<!-- ═══ TERMINAL ═══ -->
<div id="terminal"></div>

<!-- ═══ BOTTOM BAR ═══ -->
<div id="bar">
  <div id="loc">VOID_LOBBY</div>
  <input type="text" id="inp" placeholder="Type a command..." autofocus autocomplete="off" spellcheck="false">
</div>

<!-- ═══ LOAD JS FILES IN ORDER ═══ -->
<!-- save.js first (no dependencies) -->
<!-- host.js second (needs DOM only) -->
<!-- story/intro.js third (just data) -->
<!-- game.js last (uses everything above) -->
<script src="js/save.js"></script>
<script>if(!window.Save) document.title="ERROR: save.js failed";</script>

<script src="js/host.js"></script>
<script>if(!window.Host) document.title="ERROR: host.js failed";</script>

<script src="story/intro.js"></script>
<script>if(!window.StoryIntro) document.title="ERROR: intro.js failed";</script>

<script src="js/game.js"></script>
<script>if(!window.Game) document.title="ERROR: game.js failed";</script>

</body>
</html>
